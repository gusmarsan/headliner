name: Apply CPU power choice patch

on:
  push:
    branches:
      - 'chatgpt/cpu-power-choice'
    paths:
      - '.github/workflows/apply-cpu-power.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and validate isolated patch
        run: python .github/workflows/apply_cpu_power.py
      - name: Verify diff
        run: |
          git diff --check
          git diff --exit-code -- . ':!index.html' || true
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: consider powers in CPU attribute choice"
          git push
