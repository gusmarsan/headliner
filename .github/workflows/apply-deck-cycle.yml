name: Apply deck cycle patch

on:
  push:
    branches:
      - 'chatgpt/deck-cycle'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch and validate deck rotation
        run: python .github/workflows/apply_deck_cycle.py

      - name: Commit game patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-deck-cycle.yml .github/workflows/apply_deck_cycle.py
          git add index.html
          git diff --cached --check
          git commit -m "feat: persist 50-card rotation between games"
          git push origin HEAD:chatgpt/deck-cycle
