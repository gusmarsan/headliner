name: Apply festival name patch

on:
  push:
    branches:
      - 'chatgpt/festival-name-poetry'

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'run festival name patch workflow')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply richer winner festival names
        run: python .github/workflows/apply_festival_names.py

      - name: Validate generated JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          start=html.index('function festivalName(head)')
          end=html.index('function finishGame()',start)
          fn=html[start:end]
          Path('/tmp/festival-name.js').write_text(fn+'\nconsole.log(festivalName([]));\n',encoding='utf-8')
          PY
          node --check /tmp/festival-name.js

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "feat: make winner festival names more surreal"
          git push
