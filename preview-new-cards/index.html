<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Headliner · Preview de 10 novas cartas</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&display=swap');
:root{--ink:#ead7b4;--paper:#111210;--line:#b18c59;--cream:#f2e2bc;--ui:Inter,system-ui,sans-serif;--display:'Barlow Condensed','Arial Narrow',sans-serif}
*{box-sizing:border-box}body{margin:0;background:#20211f;color:var(--cream);font-family:var(--ui);padding:28px}header{max-width:1420px;margin:0 auto 24px;text-align:center}h1{margin:0;font:900 clamp(30px,5vw,58px)/.9 var(--display);letter-spacing:.02em;text-transform:uppercase}header p{margin:10px auto 0;color:#cbbd9f;font-size:13px}main{max-width:1420px;margin:auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:22px}.preview-card{--a:#9a3f43;--b:#c79b56;--c:#1e2221;position:relative;width:100%;aspect-ratio:311/456;padding:7px;border:1px solid #15130f;border-radius:17px;background:linear-gradient(145deg,#0e0e0d 0 8%,#9a7a4f 11%,#d8bd86 15%,#30271d 19%,#11110f 24% 77%,#5c482f 82%,#d1af76 88%,#11110f 94%);box-shadow:0 18px 28px rgba(0,0,0,.36),inset 0 0 0 1px rgba(255,235,190,.4);overflow:hidden;cursor:pointer;transition:transform .16s,box-shadow .16s}.preview-card:hover{transform:translateY(-5px);box-shadow:0 24px 34px rgba(0,0,0,.46)}.preview-card:before{content:"";position:absolute;inset:3px;border-radius:16px;border:1px solid #a88b60;box-shadow:inset 0 0 0 2px #171613,inset 0 0 0 4px rgba(218,190,137,.38);pointer-events:none;z-index:8}.card-front{position:relative;width:100%;height:100%;overflow:hidden;border-radius:11px;background:#0a0c0c}.hero{position:relative;height:48%;overflow:hidden;background:#151211;border-bottom:2px solid var(--line)}.hero img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.92) contrast(1.08)}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,6,6,.18),rgba(5,6,6,.04) 34%,rgba(5,6,6,.68) 100%)}.artist{position:absolute;z-index:3;left:14px;right:62px;top:11px;color:#ead7b4;font:800 clamp(25px,2.5vw,48px)/.8 var(--display);letter-spacing:-.025em;text-shadow:0 2px 0 #111,0 5px 11px rgba(0,0,0,.68);text-transform:uppercase}.artist.long{font-size:clamp(22px,2vw,39px)}.artist.xlong{font-size:clamp(20px,1.8vw,33px)}.micro{position:absolute;z-index:4;right:4px;top:0;width:58px;height:74px;display:grid;place-items:center;align-content:center;gap:4px;padding:6px 4px 9px;background:rgba(9,10,10,.9);border:1px solid #c2a16d;color:#ead7b1;clip-path:polygon(0 0,100% 0,100% 74%,50% 100%,0 74%);font:700 9px/1 var(--display);text-align:center;text-transform:uppercase}.micro strong{font-size:13px}.descriptor{height:10%;display:flex;flex-direction:column;justify-content:center;padding:0 12px;background:color-mix(in srgb,var(--a) 12%,#111210);border-bottom:1px solid rgba(218,188,132,.38);font:600 10px/1.1 var(--display);text-transform:uppercase}.descriptor span{color:#cdbb9b;font-size:9px;margin-top:2px}.stats{height:24%;display:grid;grid-template-rows:repeat(5,1fr);gap:0;padding:4px 10px;background:linear-gradient(90deg,#090b0b,#111515 54%,#090b0b)}.stat{display:grid;grid-template-columns:14px minmax(0,1fr) 26px 45px;align-items:center;gap:4px;border-bottom:1px solid rgba(189,153,100,.42);font:600 9px/1 var(--display);text-transform:uppercase}.stat i{width:14px;height:14px;border:1px solid #c3a16d;border-radius:50%;background:#121311}.stat b{text-align:right;font-size:12px}.bar{height:7px;border:1px solid rgba(204,170,111,.68);background:linear-gradient(90deg,var(--bar) var(--pct),rgba(255,255,255,.12) var(--pct))}.power{height:13%;display:grid;grid-template-columns:28px 1fr;align-items:center;gap:6px;margin:2px 8px;padding:3px 6px;background:linear-gradient(96deg,color-mix(in srgb,var(--b) 18%,#171512),#10100f);border:1px solid color-mix(in srgb,var(--b) 52%,#b38d59);overflow:hidden}.power .bolt{width:24px;height:24px;border:1px solid #cfac72;border-radius:50%;display:grid;place-items:center;color:#e2c386;font-size:14px}.power strong{display:block;font:700 10px/1 var(--display);text-transform:uppercase}.power small{display:block;margin-top:2px;color:#d8c39d;font:500 7px/1.05 var(--display)}.public{height:14%;display:grid;grid-template-columns:26px 34px minmax(0,1fr) auto;align-items:center;gap:4px;padding:4px 8px;background:linear-gradient(100deg,#22191d,#090b0b 49%);border-top:2px solid var(--line)}.public .icon{width:24px;height:24px;border:1px solid #c9a76f;border-radius:50%;display:grid;place-items:center;color:#d6b779;font-size:12px}.public label{font:600 8px/1 var(--display);text-transform:uppercase}.public strong{font:900 clamp(18px,2vw,30px)/.8 var(--display);text-align:left}.public small{padding:3px 3px;background:#c4a06d;color:#171511;font:700 7px/1 var(--display);text-transform:uppercase}.no-power .power{display:none}.no-power .stats{height:37%}.no-power .public{height:15%}dialog{width:min(440px,92vw);padding:0;border:0;background:transparent}dialog::backdrop{background:rgba(0,0,0,.78);backdrop-filter:blur(5px)}dialog .preview-card{width:100%;cursor:default;transform:none}dialog button{display:block;margin:14px auto 0;border:1px solid #b18c59;background:#183c4b;color:#f3dfad;padding:9px 18px;font:700 13px var(--ui);cursor:pointer}
@media(max-width:1100px){main{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:680px){body{padding:16px 10px}main{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.preview-card{border-radius:12px}.artist{left:9px;right:46px;font-size:clamp(20px,6vw,31px)}.artist.long{font-size:clamp(18px,5vw,26px)}.micro{width:43px;height:58px;font-size:7px}.micro strong{font-size:10px}.descriptor{padding:0 7px;font-size:8px}.descriptor span{font-size:7px}.stats{padding:3px 6px}.stat{grid-template-columns:10px minmax(0,1fr) 21px 34px;gap:2px;font-size:7px}.stat i{width:10px;height:10px}.stat b{font-size:9px}.bar{height:5px}.power{margin:1px 4px;padding:2px 4px;grid-template-columns:20px 1fr}.power .bolt{width:18px;height:18px;font-size:10px}.power strong{font-size:8px}.power small{font-size:6px}.public{padding:3px 4px;grid-template-columns:18px 26px minmax(0,1fr) auto;gap:2px}.public .icon{width:18px;height:18px;font-size:9px}.public label{font-size:6px}.public strong{font-size:17px}.public small{font-size:5px}}
</style></head>
<body><header><h1>Novas cartas · preview</h1><p>Área isolada para aprovação visual. Estas cartas não fazem parte do baralho oficial.</p></header><main id="gallery"></main><dialog id="zoom"><div id="zoomCard"></div><button type="button" onclick="zoom.close()">Fechar preview</button></dialog>
<script>
const cards=[
 {name:'Weezer',genre:'Alternative rock / power pop',period:'1992–atual',pub:70000,stats:[84,82,78,86,80],art:'weezer-screenprint-v1.png',colors:['#2b63a5','#d94a3c','#162d52']},
 {name:'Queen',genre:'Glam rock / arena rock',period:'1970–atual',pub:160000,stats:[98,100,96,94,99],power:['Showstopper','Sucesso +6'],art:'queen-screenprint-v1.png',colors:['#6f3c85','#d7a947','#281d32']},
 {name:'Madonna',genre:'Pop / dance pop',period:'1982–atual',pub:160000,stats:[96,100,95,97,95],power:['Reinvenção','Inovação +6'],art:'madonna-screenprint-v1.png',colors:['#e32186','#27a9ba','#21142b']},
 {name:"Guns N' Roses",genre:'Hard rock',period:'1985–atual',pub:150000,stats:[94,97,84,82,92],art:'guns-n-roses-screenprint-v1.png',colors:['#9e302e','#d89a3f','#211a18']},
 {name:'Kiss',genre:'Hard rock / glam',period:'1973–atual',pub:110000,stats:[90,91,88,78,87],art:'kiss-screenprint-v1.png',colors:['#b8a77e','#c84845','#17191f']},
 {name:'Blondie',genre:'New wave / punk / pop',period:'1974–atual',pub:75000,stats:[91,88,89,94,91],art:'blondie-screenprint-v1.png',colors:['#d59d38','#3b9b9b','#262124']},
 {name:'Titãs',genre:'Rock brasileiro / pós-punk',period:'1982–atual',pub:60000,stats:[82,79,86,88,87],art:'titas-screenprint-v1.png',colors:['#1f7880','#bb4e3e','#202427']},
 {name:'Sepultura',genre:'Metal / thrash / groove metal',period:'1984–atual',pub:45000,stats:[88,82,86,93,90],power:['Roots','Influência +6'],art:'sepultura-screenprint-v1.png',colors:['#74613a','#a74735','#171817']},
 {name:'L7',genre:'Alternative rock / grunge',period:'1990–atual',pub:40000,stats:[80,75,78,86,79],art:'l7-screenprint-v1.png',colors:['#6d7653','#a94c70','#202226']},
 {name:'Portishead',genre:'Trip hop',period:'1991–atual',pub:25000,stats:[87,78,82,96,91],art:'portishead-screenprint-v1.png',colors:['#72544a','#a88d61','#171a1c']}
];
const labels=['Influência','Sucesso','Longevidade','Inovação','Prestígio'];
function card(c){const vars=`--a:${c.colors[0]};--b:${c.colors[1]};--c:${c.colors[2]}`;const nameClass=c.name.length>15?'xlong':c.name.length>10?'long':'';return `<article class="preview-card card large ${c.power?'has-power':'no-power'}" style="${vars}" data-name="${c.name}"><div class="card-front"><section class="hero art-window"><img src="art/${c.art}" alt="Ilustração screenprint de ${c.name}"><div class="artist name ${nameClass}">${c.name}</div><div class="micro card-micro"><span>HEADLINER</span><strong>${c.name.slice(0,3).toUpperCase()}</strong><span>PREVIEW</span></div></section><section class="descriptor"><b>${c.genre}</b><span>${c.period}</span></section><section class="stats">${c.stats.map((v,i)=>`<div class="stat"><i></i><span>${labels[i]}</span><b>${v}</b><u class="bar" style="--bar:${['#d66aa2','#ef7e42','#d9b83c','#8ec45a','#56a9c7'][i]};--pct:${v}%"></u></div>`).join('')}</section>${c.power?`<section class="power power-zone"><span class="bolt power-emblem">⚡</span><div><strong>${c.power[0]}</strong><small>${c.power[1]}</small></div></section>`:''}<section class="public"><span class="icon public-icon">●</span><label>Público</label><strong>${c.pub.toLocaleString('pt-BR')}</strong><small>pessoas</small></section></div></article>`}
const gallery=document.querySelector('#gallery');gallery.innerHTML=cards.map(card).join('');const zoom=document.querySelector('#zoom'),zoomCard=document.querySelector('#zoomCard');gallery.addEventListener('click',e=>{const el=e.target.closest('.preview-card');if(!el)return;const c=cards.find(x=>x.name===el.dataset.name);zoomCard.innerHTML=card(c);zoom.showModal()});
</script></body></html>
