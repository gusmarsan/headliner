/* ===== V8 — premium card and game polish ===== */
:root{

html,body{background:var(--night);font-family:var(--body);text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased}

*{scrollbar-width:thin;scrollbar-color:#c6a074 rgba(8,18,24,.72)}

button:focus-visible,.slot:focus-visible,.hand-card:focus-visible{outline:0;box-shadow:var(--focus);position:relative;z-index:30}
.logo,.table:after,.start-box h1,.modal-head h2,.confirm-box h2,.end-box h2,.festival-name,.card .name,.public strong,.vs{font-family:var(--display)}

.logo{font-size:27px;font-weight:900;letter-spacing:.02em}.status{font-size:12px;font-variant-numeric:tabular-nums}.menu-btn{min-height:38px;padding:8px 14px;transition:background .15s,transform .15s}.menu-btn:hover{background:var(--spot);transform:translateY(-1px)}

/* ===== V14 — APPROVED MOCKUP CONVERGENCE =====
   Keep one master collectible card: dark printed face, restrained warm rules,
   poster title over the art, icon-led stats, and a dedicated Público footer.
   Contexts only change scale and density. */
.card{
  --vellum:#e7d3a8;
  --char:#10100f;
  width:190px;
  height:300px;
  padding:6px;
  border-radius:15px;
  background:linear-gradient(145deg,#171715 0 9%,#bf9c62 12%,#e9d5a9 17%,#4a3b29 20%,#171715 25% 75%,#5a452b 80%,#ead7ae 84%,#bd9658 90%,#171715 94%);
  box-shadow:0 16px 30px rgba(29,18,11,.44),inset 0 0 0 1px rgba(255,239,202,.45);
}
.card:before{
  inset:2px;
  border:1px solid #151513;
  border-radius:14px;
  box-shadow:inset 0 0 0 2px rgba(235,211,164,.58),inset 0 0 0 4px rgba(24,23,20,.82);
}
.card:after{
  inset:6px;
  border-color:rgba(238,216,170,.66);
  border-radius:10px;
  opacity:.8;
  background-image:radial-gradient(circle at 18% 18%,rgba(255,244,211,.16) 0 .5px,transparent .8px),radial-gradient(circle at 78% 64%,rgba(0,0,0,.28) 0 .5px,transparent .85px);
  background-size:9px 11px,13px 15px;
  mix-blend-mode:overlay;
}
.card-front{
  display:grid;
  width:100%;
  height:100%;
  border-radius:9px;
  overflow:hidden;
  background:#0c0e0e;
  box-shadow:inset 0 0 0 1px #080a0a;
}
.card.no-power .card-front{grid-template-rows:8% 55% 24% 13%}
.card.has-power .card-front{grid-template-rows:8% 47% 20% 12% 13%}
.card-front:before{
  content:"";
  position:absolute;
  inset:0;
  z-index:25;
  pointer-events:none;
  background:linear-gradient(112deg,rgba(255,244,211,.08),transparent 18% 63%,rgba(213,181,122,.08) 70%,transparent 78%);
  mix-blend-mode:screen;
}
.card-front:after{inset:3px;z-index:26;border:1px solid rgba(210,181,128,.52);border-radius:8px}
.foil{opacity:.14;background:linear-gradient(118deg,transparent 0 28%,rgba(255,241,200,.28) 33%,transparent 39% 70%,rgba(255,255,255,.14) 75%,transparent 82%)}
.card-micro{
  position:relative;
  z-index:8;
  display:grid;
  grid-template-columns:20px 1fr auto;
  align-items:center;
  gap:5px;
  padding:0 8px;
  background:linear-gradient(90deg,color-mix(in srgb,var(--c1) 54%,#151411),#111210 74%);
  border-bottom:1px solid rgba(236,211,161,.68);
  color:#f1dfb9;
  font-family:var(--display);
  text-transform:uppercase;
}
.card-micro:after{
  content:"";
  position:absolute;
  right:7px;
  top:0;
  width:30px;
  height:34px;
  border:1px solid rgba(211,183,132,.62);
  background:rgba(8,10,10,.7);
  clip-path:polygon(0 0,100% 0,100% 72%,50% 100%,0 72%);
  opacity:.75;
  pointer-events:none;
}
.card-micro b{position:relative;z-index:1;font-size:7px;letter-spacing:.14em}
.micro-symbol{font-size:11px;text-align:center}
.card .card-number{position:relative;z-index:2;color:#ead4a9;font-size:6px;letter-spacing:.08em;text-shadow:none}
.artist-zone{
  position:absolute;
  left:0;
  right:0;
  top:8%;
  height:55%;
  z-index:7;
  display:flex;
  align-items:flex-start;
  padding:13px 12px;
  background:linear-gradient(180deg,rgba(8,9,9,.18),transparent 38%,rgba(7,8,8,.46) 100%);
  overflow:hidden;
  pointer-events:none;
}
.card.has-power .artist-zone{height:47%}
.artist-zone:after{display:none}
.card .artist-zone .name{
  position:relative;
  inset:auto;
  z-index:2;
  width:calc(100% - 40px);
  max-height:66px;
  color:#f0dfbc;
  font-family:var(--display);
  font-size:30px;
  font-weight:900;
  line-height:.84;
  letter-spacing:-.028em;
  text-transform:uppercase;
  text-wrap:balance;
  text-shadow:0 2px 0 rgba(4,5,5,.9),0 5px 12px rgba(0,0,0,.54);
  overflow:hidden;
}
.card .artist-zone .name.long{font-size:24px;line-height:.88}
.card .artist-zone .name.xlong{font-size:18px;line-height:.92}
.art-window{
  position:relative;
  min-height:0;
  z-index:1;
  overflow:hidden;
  background-color:color-mix(in srgb,var(--c3) 45%,#11110f);
  background-blend-mode:soft-light,normal;
  border:0;
  box-shadow:inset 0 0 0 1px rgba(231,202,145,.34),inset 0 -22px 28px rgba(0,0,0,.18);
}
.art-window:before{
  content:"";
  position:absolute;
  inset:0;
  z-index:2;
  background:linear-gradient(180deg,rgba(4,6,6,.16) 0 30%,transparent 45%,rgba(5,6,6,.74) 100%),linear-gradient(90deg,color-mix(in srgb,var(--c1) 23%,transparent),transparent 52%);
  mix-blend-mode:multiply;
}
.art-window:after{
  content:"";
  position:absolute;
  inset:5px;
  z-index:3;
  border:1px solid rgba(238,216,170,.38);
  background-image:radial-gradient(circle at 18% 72%,rgba(255,236,188,.2) 0 .45px,transparent .8px);
  background-size:6px 7px;
  opacity:.55;
  mix-blend-mode:screen;
}
.art-mark{display:none}
.descriptor{
  position:absolute;
  left:0;
  right:0;
  top:calc(8% + 55% - 20px);
  height:20px;
  z-index:9;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:6px;
  padding:0 12px;
  background:linear-gradient(90deg,rgba(8,9,9,.78),rgba(8,9,9,.15));
  border:0;
  color:#eddab5;
  font-family:var(--display);
  overflow:hidden;
}
.card.has-power .descriptor{top:calc(8% + 47% - 20px)}
.descriptor b{font-size:7px;font-weight:700;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.descriptor span{font-size:6px;color:#d7c39d;white-space:nowrap}
.card .stats{
  position:relative;
  inset:auto!important;
  z-index:4;
  min-height:0;
  display:grid;
  grid-template-rows:repeat(5,1fr);
  gap:0;
  padding:4px 8px;
  background:linear-gradient(90deg,#0b0e0f,#111719 56%,#0b0e0f);
  overflow:hidden;
}
.card .stat{
  position:relative;
  height:auto;
  min-height:0;

  grid-template-columns:18px minmax(58px,1fr) 24px minmax(36px,1.45fr);
  align-items:center;
  gap:4px;

  border-radius:0;
  background:none;
  overflow:hidden;

   printed rules instead of a beveled UI bezel, and Público retained as the
   dominant footer across the readable card contexts. */
.card.variant-dark,.card.variant-neon,.card.variant-solar{border-radius:16px;padding:5px}
.card.variant-dark{background:#141517;border:1px solid #c0a16d;box-shadow:0 13px 26px rgba(29,18,11,.42),inset 0 0 0 1px rgba(245,225,184,.28)}

  border-color:var(--ct-line-soft);
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ct-track) 76%,transparent),inset 0 1px color-mix(in srgb,var(--ct-text) 12%,transparent);
}
.card.has-card-theme .power-copy b,
.card.has-card-theme .power-copy p,
.card-preview-stage .card.large.has-card-theme .power-copy b,
.card-preview-stage .card.large.has-card-theme .power-copy p{color:var(--ct-power-text,var(--ct-text));text-shadow:.6px 0 var(--ct-shadow),0 1px 2px rgba(0,0,0,.36)}
.card.has-card-theme .power-copy b span,
.card-preview-stage .card.large.has-card-theme .power-copy b span{
  border-color:color-mix(in srgb,var(--ct-tag-ink) 42%,transparent);
  background-image:url('assets/card-print-texture-v1.webp'),linear-gradient(var(--ct-tag-bg),var(--ct-tag-bg-2));
  background-blend-mode:soft-light,normal;
  color:var(--ct-tag-ink);
}
.card.has-card-theme .public,
.card-preview-stage .card.large.has-card-theme .public{
  background-color:var(--ct-public-a);
  background-image:url('assets/card-print-texture-v1.webp'),linear-gradient(100deg,var(--ct-public-a),var(--ct-public-b) 47%,var(--ct-public-c));
  background-blend-mode:soft-light,normal;
  border-top-color:var(--ct-line);
}
.card.has-card-theme .public:before,
.card-preview-stage .card.large.has-card-theme .public:before{
  background-image:url('assets/crowd-strip-screenprint.svg'),linear-gradient(90deg,var(--ct-crowd),color-mix(in srgb,var(--ct-crowd) 22%,transparent) 52%,transparent 82%);
}
.card.has-card-theme .public-icon,
.card-preview-stage .card.large.has-card-theme .public-icon{

  position:absolute;
  inset:3px;
  background:var(--ct-icon-ink);

  mask:center/contain no-repeat url('assets/public-emblem-screenprint.svg');

.card.has-card-theme .public-icon svg{visibility:hidden}
.card.has-card-theme .public label,
.card.has-card-theme .public strong,
.card-preview-stage .card.large.has-card-theme .public label,
.card-preview-stage .card.large.has-card-theme .public strong{color:var(--ct-public-text,var(--ct-text));text-shadow:.7px 0 var(--ct-shadow),0 2px 2px rgba(0,0,0,.44)}
.card.has-card-theme .public small,
.card-preview-stage .card.large.has-card-theme .public small{
  background-image:url('assets/card-print-texture-v1.webp'),linear-gradient(var(--ct-tag-bg),var(--ct-tag-bg-2));

}
.card.badge-theme-themed .card-micro,
.card-preview-stage .card.large.badge-theme-themed .card-micro{

}
.card.badge-theme-themed .card-micro:before,
.card-preview-stage .card.large.badge-theme-themed .card-micro:before{

  background-blend-mode:soft-light,normal;
}

.card-preview-stage .card.large.badge-theme-themed .card-micro b{color:var(--ct-seal-ink,var(--ct-icon-ink));text-shadow:1px 0 var(--ct-shadow),0 1px 0 rgba(0,0,0,.72)}

/* V35 — artist-specific atmospheric grading. These rules alter only ink mood;
   the master card geometry and the authored illustration remain unchanged. */
.card.card-theme-joy-noir.has-artist-art .art-window,
.card-preview-stage .card.large.card-theme-joy-noir.has-artist-art .art-window{
  filter:grayscale(.68) saturate(.52) brightness(.7) contrast(1.17)!important;
}
.card.card-theme-joy-noir.has-artist-art .art-window:before,
.card-preview-stage .card.large.card-theme-joy-noir.has-artist-art .art-window:before{
  background:linear-gradient(105deg,rgba(6,10,13,.26),transparent 46%),linear-gradient(180deg,rgba(8,13,17,.08),transparent 54%,rgba(5,8,10,.3));
}
.card.card-theme-clash-riot.has-artist-art .art-window,
.card-preview-stage .card.large.card-theme-clash-riot.has-artist-art .art-window{
  filter:saturate(1.08) contrast(1.05)!important;

/* V31 — Beatles light-theme pilot. Only printed color and surface behavior
   changes; every box continues to come from the V30 master anatomy. */

.card-preview-stage .card.large.card-surface-light .stats,
.card.card-surface-light .public,
.card-preview-stage .card.large.card-surface-light .public{background-blend-mode:screen,normal}

.card-preview-stage .card.large.card-surface-light .power-zone:before{background-blend-mode:soft-light,normal}
.card.card-surface-light .stat span,
.card.card-surface-light .stat b,
.card-preview-stage .card.large.card-surface-light .stat span,
.card-preview-stage .card.large.card-surface-light .stat b{
  text-shadow:.65px 0 color-mix(in srgb,var(--ct-accent) 42%,transparent),-.45px 0 rgba(255,240,199,.58);
}
.card.card-surface-light .stat u:before,
.card-preview-stage .card.large.card-surface-light .stat u:before{opacity:.94;filter:saturate(.92) contrast(1.03)}

.card-preview-stage .card.large.card-surface-light .public:before{mix-blend-mode:multiply;opacity:.5}
.card.card-surface-light .public label,
.card.card-surface-light .public strong,

.card-preview-stage .card.large.card-surface-light .public strong{

/* V36 — title-only corrections for the audited cards. The master geometry,
   printed surfaces and artwork remain untouched unless a local title adjustment is set. */
.card-preview-stage .card.large.has-artist-art.art-title-tone-light .artist-zone .name{
  color:#f4dfb5!important;

  text-shadow:0 2px 0 #12100d,0 4px 10px rgba(0,0,0,.9)!important;
  mix-blend-mode:normal!important;
  filter:contrast(1.14)!important;
}
.card-preview-stage .card.large.has-artist-art.art-title-adjust .artist-zone .name{
  transform:scale(var(--artist-title-scale,1)) scaleX(var(--artist-title-scale-x,1));
  transform-origin:left top;
}

/* V37 — Power is now a deliberate two-layer module: name + effect. */
.power-zone{
  --power-copy-gap:3px;
}
.power-zone .power-copy{
  display:grid;
  grid-template-rows:auto auto;
  align-content:center;
  row-gap:var(--power-copy-gap);
}
.power-zone .power-copy b,
.power-zone .power-copy p{
  margin:0;
}
.power-zone .power-copy p{
  font-weight:700;
  letter-spacing:.018em;
}
.card-preview-stage .card.large .power-zone .power-copy{
  align-self:stretch;
}
.card-preview-stage .card.large .power-zone .power-copy p{
  margin:0;
  font-size:12px;
  line-height:1.05;
}
.card-preview-stage .card.large .power-zone.power-medium{
  --power-copy-gap:3px;
}
.card-preview-stage .card.large .power-zone.power-medium .power-copy p{
  margin:0;
  font-size:10.75px;
  line-height:1.07;
}
.card-preview-stage .card.large .power-zone.power-long{
  --power-copy-gap:2px;
}
.card-preview-stage .card.large .power-zone.power-long .power-copy p{
  margin:0;
  font-size:9.35px;
  line-height:1.04;
}

/* V38 — title scale responds to the title itself, independently of effect length. */
.power-zone .power-copy b strong{
  overflow-wrap:normal;
  word-break:normal;
  hyphens:none;
}
.card-preview-stage .card.large .power-zone.power-title-short .power-copy b strong{

  line-height:28px;
  height:30px;
  letter-spacing:.004em;
}
.card-preview-stage .card.large .power-zone.power-title-medium .power-copy b strong{
  font-size:20.5px;
  line-height:22px;
  min-height:24px;
  letter-spacing:.006em;
}
.card-preview-stage .card.large .power-zone.power-title-long{

  --power-copy-gap:0px;
  padding:3px 42px;
}
.card-preview-stage .card.large .power-zone.power-title-long:after{

  height:24px;
  opacity:.48;

.card-preview-stage .card.large .power-zone.power-title-long .power-copy b{
  align-items:start;
  column-gap:7px;
}
.card-preview-stage .card.large .power-zone.power-title-long .power-copy b strong{

  height:32px;

  text-wrap:balance;
}
.card-preview-stage .card.large .power-zone.power-medium .power-copy p{

  min-height:24px;
}
.card-preview-stage .card.large .power-zone.power-long .power-copy p{
  font-size:8.5px;
  line-height:10px;
  min-height:30px;
}

/* Final-card integration — game contexts reuse the audited V30/V31 master
   renderer at contextual scale. No alternate card anatomy is introduced. */
.live-card-stage.card-preview-stage{
  min-height:0;
  display:block;
  padding:0;
  background:transparent;
  position:relative;
  place-items:unset;
  overflow:visible;

/* ===== UI POLISH V1 — controls, menus and modals only ===== */
:root{
  --ui:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --ui-paper:#f1e3bc;--ui-paper-hi:#f8edcf;--ui-paper-low:#dfc895;--ui-ink:#173945;
  --ui-muted:#5d6e70;--ui-line:rgba(51,66,61,.24);--ui-blue:#166f8c;--ui-blue-dark:#0e5067;
  --ui-gold:#d6aa3f;--ui-coral:#bc4d3d;--ui-night:#0b1e27;--ui-night-2:#102b36;
}
button{font-family:var(--ui);font-weight:700;letter-spacing:0}

/* Approved cover appears before mode selection. */
.cover-screen{--cover-image:url('assets/cover-official-desktop.png');position:relative;width:100vw;height:100svh;height:100dvh;min-height:100svh;overflow:hidden;background:#087aaa;isolation:isolate}
.cover-screen:before{content:"";position:absolute;z-index:-2;inset:-14px;display:block;background:var(--cover-image) center/cover no-repeat;filter:blur(11px) saturate(.9) brightness(.82);transform:scale(1.025)}
.cover-screen:after{content:"";position:absolute;z-index:1;inset:0;display:block;background:linear-gradient(90deg,rgba(5,77,108,.16),transparent 17% 83%,rgba(5,77,108,.16));pointer-events:none}
.cover-art-button{position:absolute;inset:0;z-index:0;display:grid;place-items:center;width:100vw;height:100%;padding:0;border:0;border-radius:0;background:transparent;cursor:pointer;overflow:visible;box-shadow:none}
.cover-frame{position:relative;display:grid;place-items:center;width:min(100vw,calc(100dvh * 16 / 9));height:min(100dvh,calc(100vw * 9 / 16));aspect-ratio:16/9}
.cover-art-button picture{position:absolute;inset:0;display:grid;place-items:center;width:100%;height:100%}
.cover-art{position:relative;inset:auto;display:block;width:100%;height:100%;max-width:100%;max-height:100%;object-fit:contain;object-position:center}
.cover-final-copy{position:absolute;inset:0;z-index:2;pointer-events:none}
.cover-final-caption{position:absolute;bottom:1.2%;width:25.5%;min-height:5.1%;display:flex;align-items:center;justify-content:center;padding:.25% 1%;background:linear-gradient(180deg,rgba(7,28,36,.08),rgba(7,28,36,.9) 36%,rgba(7,28,36,.96));color:#f4e7c4;font-family:"Barlow Condensed",Impact,sans-serif;font-size:clamp(12px,1.45vw,24px);font-weight:900;line-height:1;text-transform:uppercase;letter-spacing:.025em;text-align:center;text-shadow:0 2px 3px rgba(0,0,0,.85)}
.cover-final-caption.left{left:15.5%}
.cover-final-caption.right{right:15.5%}
.cover-art-button:focus-visible{outline:4px solid #ffd24e;outline-offset:-8px}
.visually-hidden{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;clip-path:inset(50%)!important;white-space:nowrap!important;border:0!important}

/* Mode-selection screen: simpler hierarchy, no oversized glass card. */
.start-screen{background:linear-gradient(180deg,rgba(5,14,18,.08),rgba(5,14,18,.48) 56%,rgba(5,14,18,.86)),url('assets/festival-top.webp') center/cover no-repeat}
.start-screen:before{inset:0;background:linear-gradient(90deg,rgba(5,15,20,.38),transparent 25% 75%,rgba(5,15,20,.38)),radial-gradient(ellipse at 50% 105%,rgba(25,125,156,.28),transparent 52%)}
.start-box{width:min(660px,calc(100vw - 32px));max-width:none;box-sizing:border-box;padding:30px 32px 28px;background:rgba(242,226,186,.96);color:var(--ui-ink);border:1px solid rgba(79,65,43,.45);border-radius:14px;box-shadow:0 24px 64px rgba(0,0,0,.36);backdrop-filter:blur(8px)}
.start-brand{display:flex;justify-content:center;align-items:baseline;gap:8px;margin-bottom:18px;font-family:var(--display);font-weight:900;text-transform:uppercase;color:#17475a;letter-spacing:.02em}
.start-brand strong{font-size:24px;line-height:1}.start-brand span{font-family:var(--ui);font-size:9px;font-weight:800;letter-spacing:.16em;color:#a34b3d}
.start-box h1{margin:0;color:var(--ui-ink);font-family:var(--display);font-size:clamp(42px,6vw,58px);font-weight:900;line-height:.94;letter-spacing:-.015em;text-shadow:none;transform:none;text-transform:uppercase}
.start-box p.start-lead{max-width:500px;margin:12px auto 22px;color:#4e6265;font-family:var(--ui);font-size:14px;line-height:1.5}
.start-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.start-utility .utility-icon-btn{background:rgba(243,228,190,.9);color:#173945;border-color:rgba(61,56,42,.4);box-shadow:0 8px 24px rgba(0,0,0,.18)}

/* Top bar and in-game controls. */
.topbar{min-height:48px;padding:6px 8px 6px 14px;border-radius:10px;background:rgba(8,25,33,.9);border:1px solid rgba(238,217,173,.28);box-shadow:0 10px 26px rgba(0,0,0,.28);backdrop-filter:blur(10px)}
.logo{font-size:25px;line-height:1;font-weight:900}.status{font-family:var(--ui);font-size:11px;font-weight:650;color:#e2e4d8}.status strong{color:#f0c759}

.menu-btn:hover{background:rgba(241,224,185,.17);color:#fff0c9;transform:none}

.danger{background:#a84a3c;border:1px solid #7f332a;color:#fff0df}.primary:hover,.secondary:hover,.danger:hover{transform:none;filter:none}

/* Modals: one consistent paper/ticket language rather than generic blue cards. */
.modal{background:rgba(3,11,15,.76);backdrop-filter:blur(10px)}
.modal-card{background:var(--ui-paper);color:var(--ui-ink);border:1px solid rgba(78,62,39,.48);border-radius:14px;box-shadow:0 28px 90px rgba(0,0,0,.5)}

.exit-actions{gap:8px}

/* Settings. */

  .start-actions{grid-template-columns:1fr}.mode{min-height:66px;padding:11px 14px}.mode strong{font-size:21px}.start-meta{flex-wrap:wrap;gap:6px;font-size:9px}
  .topbar{border-radius:8px}.logo{font-size:20px}.status{font-size:9px}.menu-btn{font-size:9px;padding:6px 7px}.attr-panel{padding:2px}.attr-btn{min-height:30px;padding:5px 7px;font-size:8px}

/* V40 — acabamento editorial: preserva a mesa V39 e corrige a camada de uso. */
:root{--ui:'Barlow Condensed','Arial Narrow',sans-serif;--ink:#143844;--paper:#f3dfad;--paper-edge:#9c7041;--festival-blue:#10516a;--festival-blue-deep:#0a2c39;--coral:#c6513e;--sun:#e7bc54}
button,.position,.status,.help,.card-gallery-counter,.card-gallery-hint{font-family:var(--ui)}

/* Shared printed-ticket grammar: content-sized controls with shallow, rounded
   side perforations. Variants change rhythm and padding, never the identity. */
.ticket-control,
.mode,
.menu-btn,
.topbar,
.result-strip.round-instruction,
.round-controls .primary,
.round-controls .secondary,
.network-actions button{
 --ticket-notch:3px;
 --ticket-pitch:16px;
 --ticket-inline:15px;
 --ticket-gutter:10px;
 box-sizing:border-box;
 padding-left:max(var(--ticket-inline),calc(var(--ticket-notch) + var(--ticket-gutter)));
 padding-right:max(var(--ticket-inline),calc(var(--ticket-notch) + var(--ticket-gutter)));
 border-radius:2px;
 clip-path:none!important;
 -webkit-mask:
  radial-gradient(circle at 0 50%,transparent 0 var(--ticket-notch),#000 calc(var(--ticket-notch) + .7px)) left top/51% var(--ticket-pitch) repeat-y,
  radial-gradient(circle at 100% 50%,transparent 0 var(--ticket-notch),#000 calc(var(--ticket-notch) + .7px)) right top/51% var(--ticket-pitch) repeat-y;
 mask:
  radial-gradient(circle at 0 50%,transparent 0 var(--ticket-notch),#000 calc(var(--ticket-notch) + .7px)) left top/51% var(--ticket-pitch) repeat-y,
  radial-gradient(circle at 100% 50%,transparent 0 var(--ticket-notch),#000 calc(var(--ticket-notch) + .7px)) right top/51% var(--ticket-pitch) repeat-y;
}

.menu-btn,
.round-controls .primary,
.round-controls .secondary,

 letter-spacing:.045em;

const DECK_CYCLE_VERSION=1;

let deckCycleMemory=null;
function deckCycleRandomIndex(max){
  if(max<=1)return 0;
  try{
    const cryptoObj=globalThis.crypto;
    if(cryptoObj&&typeof cryptoObj.getRandomValues==='function'){

function deckCycleShuffle(items){

}
function readDeckCycle(){

    if(riskA!==riskB)return riskA-riskB;

function balanced30(){
  const groups=['classic','punk','alt','metal','electronic'],targetPerGroup=6;
  const signature=CARDS.map(c=>`${c.name}:${c.group}`).sort().join('|');
  const validNames=new Set(CARDS.map(c=>c.name)),byName=new Map(CARDS.map(c=>[c.name,c]));
  const makeFirstPool=()=>{
    let picked=[];
    const canBalance=groups.every(group=>CARDS.filter(c=>c.group===group).length>=targetPerGroup);
    if(canBalance)groups.forEach(group=>picked.push(...deckCycleShuffle(CARDS.filter(c=>c.group===group)).slice(0,targetPerGroup)));
    else picked=deckCycleShuffle(CARDS).slice(0,30);
    return deckCycleShuffle(picked);
  };

  let history=readDeckCycle();
  if(!deckCycleHistoryIsValid(history,signature,validNames))history=null;
  let selected;

  if(!history){
    selected=makeFirstPool();
  }else{
    const lastSet=new Set(history.lastGame);
    const remaining=CARDS.filter(card=>!lastSet.has(card.name));
    if(CARDS.length===50&&remaining.length===20){
      const groupNeeds=new Map();
      let balancedFeasible=true,totalRepeatsNeeded=0;
      for(const group of groups){
        const remainingCount=remaining.filter(card=>card.group===group).length;
        const previousCount=history.lastGame.map(name=>byName.get(name)).filter(card=>card&&card.group===group).length;
        const need=targetPerGroup-remainingCount;
        groupNeeds.set(group,need);
        totalRepeatsNeeded+=need;
        if(need<0||need>previousCount)balancedFeasible=false;
      }
      if(totalRepeatsNeeded!==10)balancedFeasible=false;

      let repeats=[];
      if(balancedFeasible){
        for(const group of groups){
          const need=groupNeeds.get(group);
          const candidates=history.lastGame.map(name=>byName.get(name)).filter(card=>card&&card.group===group);
          repeats.push(...deckCycleCandidateOrder(candidates,history).slice(0,need));
        }
      }else{
        const candidates=history.lastGame.map(name=>byName.get(name)).filter(Boolean);
        repeats=deckCycleCandidateOrder(candidates,history).slice(0,10);
      }
      selected=deckCycleShuffle([...remaining,...repeats]);
    }else{
      history=null;
      selected=makeFirstPool();
    }
  }

  if(selected.length!==30||new Set(selected.map(card=>card.name)).size!==30){
    history=null;
    selected=makeFirstPool();
  }

  const previousSet=new Set(history?.lastGame||[]),selectedSet=new Set(selected.map(card=>card.name));
  const appearances={},streaks={};
  for(const card of CARDS){
    const name=card.name;
    const previousAppearances=Math.max(0,Number(history?.appearances?.[name])||0);
    const previousStreak=Math.max(0,Number(history?.streaks?.[name])||0);
    appearances[name]=previousAppearances+(selectedSet.has(name)?1:0);
    streaks[name]=selectedSet.has(name)?(previousSet.has(name)?previousStreak+1:1):0;
  }
  writeDeckCycle({
    version:DECK_CYCLE_VERSION,
    signature,
    gameNumber:(Math.max(0,Number(history?.gameNumber)||0)+1),
    lastGame:selected.map(card=>card.name),
    appearances,
    streaks
  });
  return selected;
}

 if(p1Value>p2Value){state.lastResult=isLocalGame()?'Jogador 1 venceu a rodada.':'Você venceu a rodada.';resolveRound(P1)}
 else if(p2Value>p1Value){state.lastResult=isLocalGame()?'Jogador 2 venceu a rodada.':'O rival venceu a rodada.';resolveRound(P2)}
 else{state.lastResult=`${label}: ${p1Value} × ${p2Value} — ${isLocalGame()?'EMPATE — CARTAS NO POTE.':'empate! As cartas foram para o pote.'}`;resolveRound('tie')}
 state.actionLocked=false;renderGame();
}
function effective(card,attr){let value=card[attr];if(card.power&&card.power.attr===attr)value+=card.power.boost;return value}
function resolveRound(winner){
 const p1Card=player(P1).deck.shift(),p2Card=player(P2).deck.shift();
 if(winner==='tie'){state.pot.push(p1Card,p2Card);state.pendingWinner=null}
 else{player(winner).deck.push(...state.pot,p1Card,p2Card);state.pot=[];state.pendingWinner=winner;state.turn=winner}
 state.lastWinner=winner;
}
function nextRound(){
 if(!state||state.gameOver||state.actionLocked||!state.revealed||(isLocalGame()&&state.phase!=='RESULT'))return;state.actionLocked=true;
 if(state.encore!==null){state.encore--;if(player(P1).head.filter(Boolean).length===3&&player(P2).head.filter(Boolean).length===3){state.actionLocked=false;finishGame();return}if(state.encore<=0){state.actionLocked=false;finishGame();return}}
 if(!player(P1).deck.length||!player(P2).deck.length){state.actionLocked=false;finishGame();return}
 state.round++;state.selectedAttr=null;state.revealed=false;state.current=null;state.lastResult='';state.lastWinner=null;player(P1).lockedThisRound=false;player(P2).lockedThisRound=false;state.battleChooser=null;state.actionLocked=false;
 if(isLocalGame())queueLocalPass(P1,'headliner');
 else{renderGame();if(state.turn===P2)scheduleGame(beginBattle,600,'cpu')}
}
function festivalName(head){
 const cards=head.filter(Boolean),groups=new Set(cards.map(c=>c.group)),names=cards.map(c=>c.name).join(' ');
 const pick=list=>list[Math.floor(Math.random()*list.length)];
 const first=['Velvet','Psychic','Lunar','Plastic','Honey','Chromatic','Electric','Soft','Golden','Cosmic','Satellite','Invisible'];
 const middle=['Nervous System','Peach','Ghost','Dopamine','Mirage','Animal','Fever Dream','Geometry','Sugar','Moon','Heart','Static'];
 const endings=['Carnival','Ceremony','Society','Parade','Picnic','Ball','Assembly','Communion','Jubilee','Orchestra','Ritual','Transmission'];
 const add=(target,items)=>target.push(...items);
 if(groups.has('electronic')){add(first,['Neon','Laser','Chrome','Synthetic','Digital']);add(middle,['Circuit','Frequency','Signal','Voltage','Pixel']);add(endings,['Broadcast','Machine','Transmission'])}
 if(groups.has('metal')){add(first,['Iron','Black','Thunder','Ashen','Molten']);add(middle,['Cathedral','Furnace','Lightning','Temple','Ritual']);add(endings,['Mass','Assembly','Ceremony'])}
 if(groups.has('punk')){add(first,['Static','Acid','Broken','Midnight','Cheap']);add(middle,['Panic','Riot','Noise','Switchblade','Revolt']);add(endings,['Parade','Club','Assembly'])}
 if(groups.has('alt')){add(first,['Velvet','Psychic','Pacific','Sunset','Lunar']);add(middle,['Garden','Mirage','Cinema','Dream','Weather']);add(endings,['Picnic','Society','Carnival'])}
 if(groups.has('classic')){add(first,['Golden','Solar','Royal','Starlight','Kaleidoscopic']);add(middle,['Ballroom','Rainbow','Comet','Glass','Jubilee']);add(endings,['Ball','Gathering','Orchestra'])}
 if(/Joy Division|The Cure|Depeche Mode|Siouxsie/.test(names)){add(first,['Velvet','Midnight','Pale','Phantom']);add(middle,['Ghost','Nervous System','Moon','Shadow'])}
 if(/Nirvana|Pearl Jam|Soundgarden|Alice in Chains/.test(names)){add(first,['Pacific','Rust','Honey','Rain']);add(middle,['Static','Weather','Fever Dream','Noise'])}
 if(/Chemical Brothers|The Prodigy|New Order|Daft Punk|Aphex Twin|LCD Soundsystem/.test(names)){add(first,['Neon','Chrome','Laser','Synthetic']);add(middle,['Dopamine','Circuit','Frequency','Animal'])}
 if(/David Bowie|Talking Heads|Radiohead|Sonic Youth|Pixies/.test(names)){add(first,['Psychic','Alien','Invisible','Chromatic']);add(middle,['Geometry','Satellite','Cinema','Nervous System'])}
 if(/Beatles|Pink Floyd|The Doors|Led Zeppelin/.test(names)){add(first,['Cosmic','Solar','Kaleidoscopic','Golden']);add(middle,['Comet','Glass','Moon','Mirage'])}
 const roll=Math.random();
 if(roll<.34)return `${pick(first)} ${pick(middle)}`;
 if(roll<.78)return `${pick(first)} ${pick(middle)} ${pick(endings)}`;
 return `${pick(middle)} ${pick(endings)}`;
}
function resultPosterHTML({title,name,leftLabel,leftTotal,rightLabel,rightTotal,actions,tie=false}){
 const festival=name?`<p class="festival-kicker">O festival vencedor vai se chamar</p><div class="festival-name">${name}</div>`:`<p class="festival-kicker festival-tie">${tie?'Os dois festivais terminaram com o mesmo Público.':'Resultado do festival'}</p>`;
 return `<div class="end-box festival-poster"><div class="poster-production"><span>HEADLINER</span><span>EDIÇÃO 96 · AO VIVO</span></div><div class="poster-stars" aria-hidden="true">★ ✦ ★</div><div class="winner" id="festival-result-title">${title}</div>${festival}<div class="festival-scoreboard" aria-label="Público total dos festivais"><div class="festival-score"><span>${leftLabel}</span><strong>${fmt(leftTotal)}</strong><small>Público total · pessoas</small></div><div class="festival-score"><span>${rightLabel}</span><strong>${fmt(rightTotal)}</strong><small>Público total · pessoas</small></div></div><div class="poster-actions">${actions}</div><div class="poster-footer" aria-hidden="true"><span>VERÃO</span><i>★</i><span>MÚSICA</span><i>★</i><span>FESTIVAL</span></div></div>`;
}
function finishGame(){
 if(!state||state.gameOver)return;const wasPrivate=phaseIsPrivate();state.gameOver=true;state.phase='GAME_OVER';clearGameTimers();
 const p1Total=headlinerTotal(P1),p2Total=headlinerTotal(P2),local=isLocalGame(),winner=local?(p1Total===p2Total?null:p1Total>p2Total?P1:P2):(p1Total>=p2Total?P1:P2),name=winner?festivalName(player(winner).head):'';
 if(wasPrivate)renderNeutralPrivacyBackground();
 const title=local?(winner?`${playerLabel(winner)} GANHOU!`:'EMPATE!'):(winner===P1?'VOCÊ GANHOU!':'VOCÊ PERDEU!');
 const poster=resultPosterHTML({title,name,leftLabel:local?'Jogador 1':'Seu festival',leftTotal:p1Total,rightLabel:local?'Jogador 2':'Festival rival',rightTotal:p2Total,tie:!winner,actions:'<button class="primary" onclick="playAgain()">Jogar de novo</button>'});
 const root=$('#modal-root');root.innerHTML=`<div class="modal festival-result-modal" role="dialog" aria-modal="true" aria-labelledby="festival-result-title"><div class="modal-card result-poster-card">${poster}</div></div>`;
}
function playAgain(){if(!state)return;const mode=state.mode;startGame(mode)}
function toast(msg){setTimeout(()=>{let t=$('#toast');if(!t)return;t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)},20)}
function renderCover(){document.querySelector('#app').innerHTML=`<div class="cover-screen"><button class="cover-art-button" onclick="enterHeadliner()" aria-label="Começar o show"><span class="cover-frame"><picture><source media="(max-width:760px)" srcset="assets/cover-official-mobile.png"><img class="cover-art" src="assets/cover-official-desktop.png" alt="Headliner — Music Card Game. Para 1–2 jogadores, de 5–15 minutos."></picture><span class="cover-final-copy" aria-hidden="true"><span class="cover-final-caption left">REÚNA AS MELHORES CARTAS.</span><span class="cover-final-caption right">MONTE SEU FESTIVAL!</span></span></span><span class="visually-hidden">Começar o show</span></button></div>`}
function enterHeadliner(){renderStart();headlinerRunAfterOnboarding()}
function renderStart(){closeModal();document.querySelector('#app').innerHTML=`<div class="start-screen"><div class="start-utility"><button class="utility-icon-btn" onclick="openSettings()" aria-label="Configurações" title="Configurações">${UI_ICON.settings}</button></div><div class="start-box" style="position:relative;z-index:2"><h1>Como você vai encarar o festival?</h1><p class="start-lead">Monte seu festival com 3 Headliners reunindo as melhores cartas.</p><div class="start-actions"><button class="mode ticket-control ticket-mode" onclick="reset()"><span class="mode-kicker">Curtir sozinho</span><strong>1 jogador</strong><small>Contra o computador</small></button><button class="mode alt ticket-control ticket-mode" onclick="startLocalGame()"><span class="mode-kicker">Curtir acompanhado</span><strong>2 jogadores</strong><small>No mesmo dispositivo</small></button></div><div class="start-meta"><span>50 artistas</span><i></i><span>30 por partida</span><i></i><span>15 para cada lado</span></div></div></div>`}
const POWER_PREVIEW_CASES=Object.freeze({
 short:Object.freeze({name:'Encore',desc:'+4 em Prestígio'}),
 medium:Object.freeze({name:'Onda Psicodélica',desc:'Recebe +8 em Inovação durante este confronto.'}),
 long:Object.freeze({name:'Frequência Psicodélica Transcontinental',desc:'Recebe +10 em Influência durante o confronto. Se vencer, a carta rival e mais uma carta do pote vão para o seu monte.'})
});
const SEVEN_CARD_POWER_OVERRIDES=Object.freeze({
 'Radiohead':Object.freeze({name:'Vanguarda Sonora',desc:'Recebe +7 em Inovação durante este confronto.'}),
 'Siouxsie and the Banshees':Object.freeze({name:'Culto Pós-Punk Transcontinental',desc:'Recebe +9 em Prestígio durante o confronto. Se vencer, preserva a carta do topo e compra mais uma do pote.'})
});
function renderCardPreview(){
 const params=new URLSearchParams(location.search),requested=(params.get('card')||'reference').trim();
 const numericIndex=Number(requested),matchedIndex=CARDS.findIndex(card=>card.name.toLocaleLowerCase('pt-BR')===requested.toLocaleLowerCase('pt-BR'));
 const index=Number.isInteger(numericIndex)&&numericIndex>=0&&numericIndex<CARDS.length?numericIndex:matchedIndex>=0?matchedIndex:12;
 const referenceCard={name:'Artista Exemplo',genre:'Alternativo',period:'2000–hoje',group:'alt',pub:120000,influence:82,success:78,longevity:73,innovation:89,prestige:85,icon:true,power:{name:'Aura de Palco',attr:'success',boost:10,desc:'Em Sucesso ou Prestígio, recebe +10. Se vencer, +1 carta. Se empatar, seu público não é reduzido.'},previewIndex:4,previewVariant:'dark',previewPalette:['#7b3641','#bb533d','#d1b278']};
 const isReference=requested.toLocaleLowerCase('pt-BR')==='reference',baseCard=isReference?referenceCard:CARDS[index];
 const requestedPowerCase=(params.get('powerCase')||'').toLocaleLowerCase('pt-BR'),validationSet=(params.get('validation')||'').toLocaleLowerCase('pt-BR');
 const previewPower=POWER_PREVIEW_CASES[requestedPowerCase]||(validationSet==='seven'?SEVEN_CARD_POWER_OVERRIDES[baseCard.name]:null);
 const card=previewPower?{...baseCard,previewIndex:isReference?baseCard.previewIndex:index,power:{...(baseCard.power||{}),...previewPower}}:baseCard;
 document.documentElement.classList.add('card-preview-mode');
 document.body.classList.add('card-preview-mode');
 document.title=`${card.name} — preview da carta · HEADLINER`;
 document.querySelector('#app').innerHTML=`<main class="card-preview-stage" aria-label="Preview isolado da carta ${card.name}" data-card-index="${index}" data-reference="${isReference}" data-power-case="${previewPower?(requestedPowerCase||'validation'):'real'}" data-validation-set="${validationSet||'none'}">${cardHTML(card,'large')}</main>`;
 if(isReference)document.querySelector('.card-preview-stage .artist-zone .name').innerHTML='<span class="title-line">Artista</span><span class="title-line">Exemplo</span>';
}
const pageParams=new URLSearchParams(location.search);
if(pageParams.get('preview')==='card')renderCardPreview();else renderCover();
</script>
